spring.application.name=KafkaDemo
server.port=8082

# Kafka broker
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=true
spring.kafka.admin.operation-timeout=10s

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=8000

# Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafka.demo.kafkademo.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.demo.kafkademo.model.OrderCreatedEvent

# Listener
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

# Logging
logging.level.root=INFO
logging.level.org.apache.kafka=WARN
logging.level.com.kafka.demo.kafkademo=INFO
