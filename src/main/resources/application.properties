# ==============================================================================
# THIẾT LẬP ỨNG DỤNG & CỔNG SERVER
# ==============================================================================
spring.application.name=KafkaDemo
server.port=8082

# ==============================================================================
# CẤU HÌNH KAFKA BROKER & ADMIN
# ==============================================================================
# Địa chỉ Kafka Broker trên máy host
spring.kafka.bootstrap-servers=localhost:9092
# Dừng khởi động app nếu không kết nối được tới Kafka Broker
spring.kafka.admin.fail-fast=true
# Thời gian tối đa chờ thao tác admin (tạo topic, kiểm tra metadata)
spring.kafka.admin.operation-timeout=10s

# ==============================================================================
# CẤU HÌNH PRODUCER (GỬI TIN NHẮN)
# ==============================================================================
# Tuần tự hóa Key thành chuỗi String
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Bật tính năng Idempotence: Đảm bảo không bị trùng lặp message khi mạng bị chập chờn gửi lại
spring.kafka.producer.properties.enable.idempotence=true
# Yêu cầu Broker xác nhận chỉ khi TẤT CẢ các bản sao (In-Sync Replicas) đã ghi đĩa an toàn
spring.kafka.producer.acks=all
# Thời gian chờ tối đa khi bộ đệm gửi tin nhắn bị đầy (3 giây)
spring.kafka.producer.properties[max.block.ms]=3000
# Thời gian chờ phản hồi tối đa cho một request gửi tin (3 giây)
spring.kafka.producer.properties[request.timeout.ms]=3000
# Tổng thời gian cho phép gửi và retry trước khi báo thất bại hoàn toàn (8 giây)
spring.kafka.producer.properties[delivery.timeout.ms]=8000

# ==============================================================================
# CẤU HÌNH CONSUMER (TIÊU THỤ TIN NHẮN)
# ==============================================================================
# Đọc từ vị trí đầu tiên nếu Consumer Group chưa từng có commit offset trước đó
spring.kafka.consumer.auto-offset-reset=earliest
# Tắt chế độ tự động commit offset định kỳ (để ứng dụng chủ động kiểm soát việc commit)
spring.kafka.consumer.enable-auto-commit=false
# Giải mã Key thành chuỗi String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Bọc Deserializer Value qua ErrorHandlingDeserializer để không bị crash khi gặp JSON lỗi
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Cho phép deserialize các class trong package model
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafka.demo.kafkademo.model
# Kiểu đối tượng mặc định ánh xạ vào khi deserialize JSON
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.demo.kafkademo.model.OrderCreatedEvent

# ==============================================================================
# CẤU HÌNH LISTENER CONTAINER
# ==============================================================================
# Commit offset sau mỗi bản ghi được xử lý thành công
spring.kafka.listener.ack-mode=record
# Số luồng (threads) chạy song song cho mỗi listener container (phù hợp với 3 partitions)
spring.kafka.listener.concurrency=3

# ==============================================================================
# CẤU HÌNH LOGGING
# ==============================================================================
logging.level.root=INFO
# Ẩn bớt các log heartbeat/polling chi tiết không cần thiết từ thư viện apache.kafka
logging.level.org.apache.kafka=WARN
# Hiển thị đầy đủ log nghiệp vụ của ứng dụng
logging.level.com.kafka.demo.kafkademo=INFO
