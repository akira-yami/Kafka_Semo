spring.application.name=KafkaDemo
server.port=8082

# Kafka broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.retries=3

# Consumer
spring.kafka.consumer.group-id=billing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafka.demo.kafkademo.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.demo.kafkademo.model.OrderCreatedEvent

# Listener
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# Logging
logging.level.root=INFO
logging.level.org.apache.kafka=WARN
logging.level.com.kafka.demo.kafkademo=INFO
